<!doctype html>
<html lang="en">
    <head>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;

                /* Background */
                background-color: #020202;
                background-image: url("background.png");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;

                margin: 0;
                padding: 40px;
            }

            .container {
                max-width: 800px;
                margin: auto;
                padding: 30px;
                border-radius: 10px;
                background-color: rgb(0 0 0 / 50%);
            }

            .main-image {
                width: 100%;
                max-width: 600px;
                height: auto;
                border-radius: 8px;
            }

            h1 {
                margin-top: 25px;
            }

            p {
                font-size: 18px;
                color: #555;
            }

            .buttons {
                margin-top: 25px;
            }

            .button {
                display: inline-block;
                padding: 12px 24px;
                margin: 5px;
                background-color: #ff006a;
                color: white;
                text-decoration: none;
                border-radius: 5px;
            }

            .button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>

    <body>

        <div class="container">

            <!-- Image -->
            <img src="Hengem.png" alt="The Hengem">

            <!-- Text -->
            <h1>Here be Games. Henrik Games.</h1>

            <p>
                Website is work in progress.
            </p>

            <!-- Buttons -->
            <div class="buttons">

                <a href="https://hengem.itch.io" class="button">
                    My Itch.Io
                </a>

                <a href="https://www.youtube.com/@Hengem" class="button">
                    My Youtube Channel
                </a>

                <a href="https://www.youtube.com/watch?v=TbTfNKBm-sU" class="button">
                    Ronald
                </a>

            </div>

        </div>

    </body>
</html>
