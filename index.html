<!doctype html>
<html lang="en">
    <head>
        <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f2f2f2;
        margin: 0;
        padding: 40px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        background-color: white;
        padding: 30px;
        border-radius: 10px;
    }

    .main-image {
        width: 100%;
        max-width: 600px;
        height: auto;
        border-radius: 8px;
    }

    h1 {
        margin-top: 25px;
    }

    p {
        font-size: 18px;
        color: #555;
    }

    .buttons {
        margin-top: 25px;
    }

    .button {
        display: inline-block;
        padding: 12px 24px;
        margin: 5px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }

    .button:hover {
        background-color: #0056b3;
    }
    </style>
    </head>

<body>

    <div class="container">

        <!-- Image -->
        <img src="https://via.placeholder.com/600x300" 
             alt="Example image" 
             class="main-image">

        <!-- Text -->
        <h1>Here be Games. Henrik Games.</h1>

        <p>
            Website is work in progress 
            I'm currently finishing my summer break
        </p>

        <!-- Buttons -->
        <div class="buttons">

            <a href="https://www.google.com" class="button">
                Google
            </a>

            <a href="https://www.youtube.com/@Hengem" class="button">
                My Youtube Channel
            </a>

            <a href="https://github.com" class="button">
                GitHub
            </a>

        </div>

    </div>

</body>
</html>
